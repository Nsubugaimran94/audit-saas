<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>AuditLog — History</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --navy: #0B1F3A;
            --navy-mid: #132B4E;
            --navy-light: #1E3F6E;
            --accent: #2563EB;
            --accent-light: #3B82F6;
            --surface: #F8FAFC;
            --surface-2: #EFF4FB;
            --border: rgba(11,31,58,0.1);
            --border-strong: rgba(11,31,58,0.2);
            --text-primary: #0B1F3A;
            --text-secondary: #4A6080;
            --text-muted: #8FA3BB;
            --success: #059669;
            --danger: #DC2626;
            --warning: #D97706;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--surface);
            color: var(--text-primary);
            min-height: 100vh;
        }

        nav {
            background: var(--navy);
            padding: 0 2rem;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }

        .logo-mark {
            width: 32px;
            height: 32px;
            background: var(--accent);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-mark svg { width: 18px; height: 18px; fill: white; }

        .logo-text { font-size: 16px; font-weight: 600; color: white; letter-spacing: -0.3px; }
        .logo-text span { color: #60A5FA; }

        .nav-links { display: flex; align-items: center; gap: 4px; }

        .nav-link {
            color: rgba(255,255,255,0.6);
            text-decoration: none;
            font-size: 13px;
            font-weight: 400;
            padding: 6px 14px;
            border-radius: 6px;
            transition: all 0.15s;
        }

        .nav-link:hover { color: white; background: rgba(255,255,255,0.08); }
        .nav-link.active { color: white; background: rgba(37,99,235,0.3); }

        .page-header {
            background: var(--navy);
            padding: 2.5rem 2rem 3.5rem;
        }

        .page-header h1 {
            font-size: 1.8rem;
            font-weight: 600;
            color: white;
            letter-spacing: -0.5px;
            margin-bottom: 4px;
        }

        .page-header p {
            font-size: 14px;
            color: rgba(255,255,255,0.4);
            font-weight: 300;
        }

        main {
            max-width: 860px;
            margin: -1.5rem auto 0;
            padding: 0 1.5rem 4rem;
            position: relative;
            z-index: 10;
        }

        .toolbar {
            background: white;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px 16px;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 12px rgba(11,31,58,0.06);
        }

        .toolbar-left {
            font-size: 13px;
            color: var(--text-muted);
        }

        .toolbar-left strong {
            color: var(--text-primary);
            font-weight: 500;
        }

        .filter-btns {
            display: flex;
            gap: 4px;
        }

        .filter-btn {
            background: none;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 5px 12px;
            font-size: 12px;
            font-family: 'DM Sans', sans-serif;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.15s;
        }

        .filter-btn:hover { background: var(--surface-2); }
        .filter-btn.active { background: var(--navy); color: white; border-color: var(--navy); }

        .audit-list { display: flex; flex-direction: column; gap: 8px; }

        .audit-row {
            background: white;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px 20px;
            border-left: 3px solid var(--border);
            cursor: pointer;
            transition: all 0.15s;
            box-shadow: 0 1px 6px rgba(11,31,58,0.04);
        }

        .audit-row:hover { box-shadow: 0 4px 16px rgba(11,31,58,0.08); transform: translateY(-1px); }
        .audit-row.clean { border-left-color: var(--success); }
        .audit-row.issues { border-left-color: var(--danger); }

        .audit-row-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .audit-filename {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-primary);
            font-family: 'DM Mono', monospace;
            max-width: 400px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .audit-badge {
            font-size: 11px;
            font-weight: 500;
            padding: 3px 10px;
            border-radius: 6px;
            flex-shrink: 0;
        }

        .audit-badge.clean { background: rgba(5,150,105,0.08); color: var(--success); }
        .audit-badge.issues { background: rgba(220,38,38,0.08); color: var(--danger); }

        .audit-row-meta {
            display: flex;
            gap: 16px;
            font-size: 12px;
            color: var(--text-muted);
        }

        .audit-meta-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .audit-meta-item svg { width: 12px; height: 12px; stroke: currentColor; fill: none; flex-shrink: 0; }

        .flags-drawer {
            display: none;
            margin-top: 14px;
            padding-top: 14px;
            border-top: 1px solid var(--border);
        }

        .flags-drawer.open { display: block; }

        .flag-item {
            display: flex;
            gap: 10px;
            align-items: flex-start;
            padding: 10px 12px;
            border-radius: 8px;
            margin-bottom: 6px;
            background: var(--surface);
        }

        .flag-item.CRITICAL { background: rgba(220,38,38,0.04); }
        .flag-item.HIGH { background: rgba(217,119,6,0.04); }

        .flag-dot-sm {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            margin-top: 5px;
            flex-shrink: 0;
        }

        .flag-item.CRITICAL .flag-dot-sm { background: var(--danger); }
        .flag-item.HIGH .flag-dot-sm { background: var(--warning); }

        .flag-item-type {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            margin-bottom: 2px;
        }

        .flag-item.CRITICAL .flag-item-type { color: var(--danger); }
        .flag-item.HIGH .flag-item-type { color: var(--warning); }

        .flag-item-detail {
            font-size: 12px;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        .flag-item-meta {
            font-size: 11px;
            color: var(--text-muted);
            font-family: 'DM Mono', monospace;
            margin-top: 2px;
        }

        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            background: white;
            border: 1px solid var(--border);
            border-radius: 12px;
        }

        .empty-icon {
            width: 52px;
            height: 52px;
            background: var(--surface-2);
            border-radius: 12px;
            margin: 0 auto 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .empty-icon svg { width: 24px; height: 24px; stroke: var(--text-muted); fill: none; }

        .empty-state h3 {
            font-size: 15px;
            font-weight: 500;
            color: var(--text-primary);
            margin-bottom: 6px;
        }

        .empty-state p {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 1.25rem;
        }

        .empty-state a {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--navy);
            color: white;
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            padding: 9px 18px;
            border-radius: 8px;
            transition: background 0.15s;
        }

        .empty-state a:hover { background: var(--navy-light); }

        .loading-state {
            text-align: center;
            padding: 3rem;
            color: var(--text-muted);
            font-size: 13px;
        }

        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<nav>
    <a href="index.html" class="logo">
        <div class="logo-mark">
            <svg viewBox="0 0 24 24"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/></svg>
        </div>
        <span class="logo-text">Audit<span>Log</span></span>
    </a>
    <div class="nav-links">
        <a href="index.html" class="nav-link">Upload</a>
        <a href="history.html" class="nav-link active">History</a>
    </div>
</nav>

<div class="page-header">
    <h1>Audit History</h1>
    <p>All statement audits run through the system</p>
</div>

<main>
    <div class="toolbar">
        <div class="toolbar-left">Showing <strong id="auditCount">—</strong> audits</div>
        <div class="filter-btns">
            <button class="filter-btn active" onclick="filterAudits('all', this)">All</button>
            <button class="filter-btn" onclick="filterAudits('issues', this)">Issues Only</button>
            <button class="filter-btn" onclick="filterAudits('clean', this)">Clean</button>
        </div>
    </div>

    <div class="audit-list" id="auditList">
        <div class="loading-state">
            <div class="spinner"></div>
            Loading audit history...
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    let allAudits = []
    let supabaseClient = null

    window.addEventListener('load', async () => {
        supabaseClient = window.supabase.createClient(
            'https://wqrimnvcfduqsdnpcitk.supabase.co',
            'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndxcmltbnZjZmR1cXNkbnBjaXRrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1ODkyOTQsImV4cCI6MjA5NjE2NTI5NH0.wDTJffnCY9GyjkIOAlQIGt85zOyr8me_NIHeKB6raao'
        )
        await loadHistory()
    })

    async function loadHistory() {
        const list = document.getElementById('auditList')

        const { data, error } = await supabaseClient
            .from('audit_results')
            .select('*')
            .order('created_at', { ascending: false })
            .limit(50)

        if (error) {
            list.innerHTML = `<div class="empty-state"><p>Error loading history: ${error.message}</p></div>`
            return
        }

        allAudits = data || []
        document.getElementById('auditCount').textContent = data ? data.length : 0
        renderAudits(data || [])
    }

    function renderAudits(audits) {
        const list = document.getElementById('auditList')

        if (!audits || audits.length === 0) {
            list.innerHTML = `
                <div class="empty-state">
                    <div class="empty-icon">
                        <svg viewBox="0 0 24 24" stroke-width="1.5"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14,2 14,8 20,8"/></svg>
                    </div>
                    <h3>No audits yet</h3>
                    <p>Upload a statement to run your first audit.</p>
                    <a href="index.html">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><polyline points="16,16 12,12 8,16"/><line x1="12" y1="12" x2="12" y2="21"/></svg>
                        Upload Statement
                    </a>
                </div>
            `
            return
        }

        let html = ''

        audits.forEach((audit, index) => {
            const hasFlags = audit.total_flags > 0
            const date = new Date(audit.created_at)
            const dateStr = date.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' })
            const timeStr = date.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' })

            let flags = Array.isArray(audit.flags) ? audit.flags : []
            if (typeof audit.flags === 'string') {
                try {
                    flags = JSON.parse(audit.flags)
                } catch (e) {
                    flags = []
                }
            }

            const criticalCount = flags.filter(f => f.severity === 'CRITICAL').length
            const highCount = flags.filter(f => f.severity === 'HIGH').length

            let flagsHTML = ''
            if (hasFlags && flags.length > 0) {
                flagsHTML = flags.map(flag => `
                    <div class="flag-item ${flag.severity || 'HIGH'}">
                        <div class="flag-dot-sm"></div>
                        <div>
                            <div class="flag-item-type">${flag.type}</div>
                            <div class="flag-item-detail">${flag.detail}</div>
                            <div class="flag-item-meta">Row ${flag.row} · Invoice: ${flag.inv_no || 'N/A'}</div>
                        </div>
                    </div>
                `).join('')
            }

            html += `
                <div class="audit-row ${hasFlags ? 'issues' : 'clean'}" onclick="toggleDrawer(${index})">
                    <div class="audit-row-top">
                        <div class="audit-filename" title="${audit.file_name}">${audit.file_name}</div>
                        <span class="audit-badge ${hasFlags ? 'issues' : 'clean'}">
                            ${hasFlags ? `⚠ ${audit.total_flags} issue(s)` : '✓ Clean'}
                        </span>
                    </div>
                    <div class="audit-row-meta">
                        <div class="audit-meta-item">
                            <svg viewBox="0 0 24 24" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                            ${dateStr} at ${timeStr}
                        </div>
                        <div class="audit-meta-item">
                            <svg viewBox="0 0 24 24" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
                            ${audit.rows_checked} rows
                        </div>
                        ${hasFlags ? `
                        <div class="audit-meta-item" style="color: var(--danger)">
                            ${criticalCount > 0 ? `${criticalCount} critical` : ''}
                            ${criticalCount > 0 && highCount > 0 ? ' · ' : ''}
                            ${highCount > 0 ? `${highCount} high` : ''}
                        </div>` : ''}
                    </div>
                    ${hasFlags ? `
                    <div class="flags-drawer" id="drawer-${index}">
                        ${flagsHTML}
                    </div>` : ''}
                </div>
            `
        })

        list.innerHTML = html
    }

    function toggleDrawer(index) {
        const drawer = document.getElementById(`drawer-${index}`)
        if (drawer) drawer.classList.toggle('open')
    }

    function filterAudits(type, btn) {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'))
        btn.classList.add('active')

        let filtered = allAudits
        if (type === 'issues') filtered = allAudits.filter(a => a.total_flags > 0)
        if (type === 'clean') filtered = allAudits.filter(a => a.total_flags === 0)

        document.getElementById('auditCount').textContent = filtered.length
        renderAudits(filtered)
    }
</script>
</body>
</html>
