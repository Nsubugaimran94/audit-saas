<!DOCTYPE html>
<html lang="en">
<head>
    <script
  src="https://js-de.sentry-cdn.com/c79c434c8fac643d1cc55406232ab180.min.js"
  crossorigin="anonymous"
></script>
    <script>
      Sentry.onLoad(function() {
        Sentry.init({
          ignoreErrors: ["Script error."],
        });
      });
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AuditLog: Set New Password</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0B1F3A">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'DM Sans', sans-serif; min-height: 100vh; display: flex; }
        .left-panel { width: 45%; background: #0B1F3A; padding: 3rem; display: flex; flex-direction: column; justify-content: space-between; }
        .logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
        .logo-mark { width: 36px; height: 36px; background: #2563EB; border-radius: 9px; display: flex; align-items: center; justify-content: center; }
        .logo-mark svg { width: 20px; height: 20px; fill: white; }
        .logo-text { font-size: 18px; font-weight: 600; color: white; letter-spacing: -0.3px; }
        .logo-text span { color: #60A5FA; }
        .left-content h1 { font-size: 2rem; font-weight: 600; color: white; letter-spacing: -0.8px; line-height: 1.2; margin-bottom: 1rem; }
        .left-content h1 em { color: #60A5FA; font-style: normal; }
        .left-content > p { font-size: 14px; color: rgba(255,255,255,0.45); line-height: 1.7; font-weight: 300; max-width: 340px; }
        .left-footer p { font-size: 12px; color: rgba(255,255,255,0.2); }
        .right-panel { flex: 1; background: #F8FAFC; display: flex; align-items: center; justify-content: center; padding: 3rem 2.5rem; }
        .auth-card { width: 100%; max-width: 400px; }
        .auth-card h2 { font-size: 1.4rem; font-weight: 600; color: #0B1F3A; letter-spacing: -0.5px; margin-bottom: 4px; }
        .auth-sub { font-size: 13px; color: #8FA3BB; margin-bottom: 2rem; }
        .auth-field { margin-bottom: 1rem; }
        .auth-field label { display: block; font-size: 12px; font-weight: 500; color: #4A6080; margin-bottom: 6px; }
        .auth-field input { width: 100%; padding: 11px 14px; border: 1px solid rgba(11,31,58,0.2); border-radius: 8px; font-size: 14px; font-family: 'DM Sans', sans-serif; color: #0B1F3A; background: white; outline: none; transition: border-color 0.15s, box-shadow 0.15s; }
        .auth-field input:focus { border-color: #2563EB; box-shadow: 0 0 0 3px rgba(37,99,235,0.08); }
        .auth-btn { width: 100%; background: #0B1F3A; color: white; border: none; border-radius: 8px; padding: 13px; font-size: 14px; font-weight: 500; font-family: 'DM Sans', sans-serif; cursor: pointer; margin-top: 0.75rem; transition: background 0.15s; }
        .auth-btn:hover { background: #1E3F6E; }
        .auth-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        #authMessage { font-size: 13px; margin-top: 10px; text-align: center; min-height: 18px; }
        .auth-switch { text-align: center; font-size: 13px; color: #8FA3BB; margin-top: 1.5rem; }
        .auth-switch a { color: #2563EB; text-decoration: none; font-weight: 500; }
        .auth-switch a:hover { text-decoration: underline; }
        @media (max-width: 768px) {
            body { flex-direction: column; }
            .left-panel { width: 100%; padding: 2rem; }
            .left-content h1 { font-size: 1.5rem; }
            .right-panel { padding: 2rem 1.5rem; }
        }
    </style>
</head>
<body>

<div class="left-panel">
    <a href="index.html" class="logo">
        <div class="logo-mark">
            <svg viewBox="0 0 24 24"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/></svg>
        </div>
        <span class="logo-text">Audit<span>Log</span></span>
    </a>

    <div class="left-content">
        <h1>Set a new<br><em>password</em></h1>
        <p>Choose a strong password to keep your audit history and account secure.</p>
    </div>

    <div class="left-footer">
        <p>© 2026 AuditLog by Automind Systems. All rights reserved.</p>
    </div>
</div>

<div class="right-panel">
    <div class="auth-card">
        <h2>New password</h2>
        <p class="auth-sub">Enter and confirm your new password below</p>

        <div class="auth-field">
            <label>New Password</label>
            <input type="password" id="newPassword" placeholder="At least 6 characters" autocomplete="new-password">
        </div>

        <div class="auth-field">
            <label>Confirm Password</label>
            <input type="password" id="confirmPassword" placeholder="Re-enter your password" autocomplete="new-password">
        </div>

        <button class="auth-btn" id="updateBtn">Update Password →</button>

        <div id="authMessage"></div>

        <div class="auth-switch">
            <a href="login.html">← Back to sign in</a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const updateButton = document.getElementById('updateBtn')
        if (updateButton) {
            updateButton.addEventListener('click', updatePassword)
        }
    })

    async function updatePassword() {
        const newPassword = document.getElementById('newPassword').value
        const confirmPassword = document.getElementById('confirmPassword').value
        const message = document.getElementById('authMessage')
        const btn = document.getElementById('updateBtn')

        if (!newPassword || !confirmPassword) {
            message.style.color = '#DC2626'
            message.textContent = 'Please fill in both fields.'
            return
        }

        if (newPassword.length < 6) {
            message.style.color = '#DC2626'
            message.textContent = 'Password must be at least 6 characters.'
            return
        }

        if (newPassword !== confirmPassword) {
            message.style.color = '#DC2626'
            message.textContent = 'Passwords do not match.'
            return
        }

        btn.disabled = true
        btn.textContent = 'Updating...'

        const client = window.supabaseClient || supabaseClient

        const { error } = await client.auth.updateUser({ password: newPassword })

        if (error) {
            message.style.color = '#DC2626'
            message.textContent = error.message
            btn.disabled = false
            btn.textContent = 'Update Password →'
            return
        }

        message.style.color = '#059669'
        message.textContent = 'Password updated! Redirecting to sign in...'

        setTimeout(() => {
            window.location.href = 'login.html'
        }, 1500)
    }
</script>
</body>
</html>
