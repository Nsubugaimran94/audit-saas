    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'DM Sans', sans-serif;
            background: #0B1F3A;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .card {
            background: white;
            border-radius: 16px;
            padding: 2.5rem;
            max-width: 420px;
            width: 100%;
            text-align: center;
        }
        .icon {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            margin: 0 auto 1.25rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .icon.success { background: rgba(5,150,105,0.1); }
        .icon.pending { background: rgba(217,119,6,0.1); }
        .icon.failed { background: rgba(220,38,38,0.1); }
        .icon svg { width: 28px; height: 28px; }
        h1 { font-size: 1.2rem; font-weight: 600; color: #0B1F3A; margin-bottom: 8px; }
        p { font-size: 13px; color: #8FA3BB; line-height: 1.6; margin-bottom: 1.5rem; }
        .btn {
            display: inline-block;
            background: #0B1F3A;
            color: white;
            text-decoration: none;
            padding: 12px 28px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
        }
        .spinner {
            width: 28px; height: 28px;
            border: 3px solid #EFF4FB;
            border-top-color: #2563EB;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
